name: Windows CI

on:
  push:
    branches: [master]
    tags:
      - "v*.*.*"
  pull_request:

permissions:
  contents: write

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and publish
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore src/Index.sln

      - name: Build
        run: dotnet build src/Index.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test src/Index.Tests/Index.Tests.csproj --no-restore --configuration Release

      - name: Publish
        run: |
          dotnet publish src/Index/Index.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/windows-x64 `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishSingleFile=false

      - name: Package
        run: |
          Compress-Archive -Path "artifacts/windows-x64/*" -DestinationPath "Index-windows-x64.zip" -Force
          (Get-FileHash "Index-windows-x64.zip" -Algorithm SHA256).Hash | Out-File -Encoding utf8 "Index-windows-x64.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Index-windows-x64
          path: |
            Index-windows-x64.zip
            Index-windows-x64.zip.sha256
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Index-windows-x64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = @"
          ## Index $tag

          Windows x64 self-contained build.

          Download `Index-windows-x64.zip`, extract, and run `Index.exe`.
          Requires Windows 11 (build 26100+).
          "@
          gh release create "$tag" `
            --title "Index $tag" `
            --notes "$notes" `
            --verify-tag `
            dist/Index-windows-x64.zip `
            dist/Index-windows-x64.zip.sha256
